name: matrix_client
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_vodozemac: ^0.6.0
  # Direct HTTP to the LiveKit JWT service, which is not part of the homeserver
  # and so is not reachable through the Matrix client's own request plumbing.
  http: ^1.2.0
  # Concrete WebRTC implementation for voice/video calls. 1.5.0 is the floor:
  # that release added Windows loopback capture, which is what lets a screen
  # share carry the shared application's audio.
  flutter_webrtc: ^1.6.0
  # MatrixRTC calls are relayed by a LiveKit SFU (this homeserver deploys one,
  # and it is what Element Call connects to). livekit_client sits on top of the
  # same flutter_webrtc version, so the two do not fight over native bits.
  livekit_client: ^2.10.0
  matrix: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite_common_ffi: ^2.4.2
  # Already resolved transitively via matrix, but listed explicitly because we
  # implement WebRTCDelegate and extend MediaDevices — both are its types, so
  # this is a direct dependency in substance.
  webrtc_interface: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
