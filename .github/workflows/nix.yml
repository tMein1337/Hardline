# Build the Nix package and push it to the Cachix binary cache, so consumers
# download the built app instead of recompiling Flutter + libwebrtc + the two
# Rust plugins from source.
#
# One-time setup outside this file:
#   * create the `hardline` cache at cachix.org
#   * add its public key to flake.nix nixConfig.extra-trusted-public-keys
#   * add a write auth token as the CACHIX_AUTH_TOKEN repository secret
name: nix

on:
  push:
    branches: [ main ]
    # A release tag can point at a commit that is not main's tip (v0.3.0-nixos
    # does), and the store path depends on the commit. Build tags too, so the
    # cache holds exactly what the release page tells people to fetch.
    tags: [ 'v*' ]
  # Pull requests only when the Nix package can change. Pushes to main and tags
  # stay unfiltered: the flake's source is the whole tree, so every commit has
  # its own store path, and the cache should hold each one.
  pull_request:
    paths:
      - 'lib/**'
      - 'linux/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      # Bundled into the app as assets, and the icon the package installs.
      - 'LICENSE'
      - 'PRIVACY.md'
      - 'macos/Runner/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/nix.yml'

# A new push to a pull request cancels the run for the previous commit.
# Pushes to main and tags always finish, so each one reaches the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A cold build (Flutter SDK, libwebrtc, two Rust toolchains) is large and
      # the runner ships with little free space, so reclaim some first.
      #
      # Every byte Nix writes lands in /nix, which is on the root filesystem, so
      # the space has to be freed *there*. That rules out the obvious answer:
      # easimon/maximize-build-space was here before and failed two different
      # ways, both silently.
      #
      #  * It mounts its new volume at $GITHUB_WORKSPACE unless told otherwise
      #    — on top of the checkout, which ran before it. `nix build .#hardline`
      #    then had no flake.nix to find and failed in *zero seconds*.
      #  * It leaves only `root-reserve-mb` free on / (1 GB by default), and
      #    /nix is on /. Installing Nix exhausted what was left, and the runner
      #    died writing its own log: "No space left on device".
      #
      # Deleting the preinstalled toolchains outright frees the same ~35 GB with
      # no second filesystem to reason about, and it frees it on the volume that
      # actually needs it. `df` brackets it so the next failure has numbers.
      - name: Free disk space for the Nix store
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            accept-flake-config = true

      # Pushes all built store paths to the cache after the build when the auth
      # token is present. Forks (PRs without the secret) still build as a check
      # but do not push.
      - uses: cachix/cachix-action@v15
        with:
          name: hardline
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # --keep-going: report every failing derivation in one run (for instance
      # each fixed-output hash to re-pin), not just the first.
      - run: nix build .#hardline --print-build-logs --keep-going
