# Check every pull request on Windows, the platform Hardline is made for.
#
# Two jobs:
#
#   build        analyze, unit and widget tests, formatting, the notices
#                check, and the release build packaged exactly as
#                tool/package_windows_release.ps1 does it on a developer's PC.
#   integration  the suites under integration_test/, which open a real window,
#                press real keys and put the overlay over the monitor. A
#                GitHub-hosted Windows runner has an interactive desktop that
#                nobody else is using, which is precisely what those suites
#                ask for (see CLAUDE.md), so they run the same two
#                `flutter drive` lines as there.
#
# The Windows release itself is still built, signed and uploaded by hand on a
# developer's PC (RELEASING.md, steps 4 to 7). The archive and installer this
# workflow leaves on the run are unsigned and are for trying a pull request
# out, not for the release page.
name: windows

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # The runner's git checks text files out with CRLF line endings. Dart
      # files would then all differ from what `dart format` writes, and
      # generated files would come out "changed" in the clean-tree check.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # write_build_info.dart needs the tag to name it on the About screen.
          fetch-depth: 0
          fetch-tags: true

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the toolchain table in RELEASING.md.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # flutter_vodozemac and super_native_extensions are Rust, built by
      # cargokit through rustup, which the runner image ships.
      - name: Toolchain versions
        run: |
          flutter --version
          rustc --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property catalog_productDisplayVersion

      # Before anything else touches the tree: the stamp refuses a dirty
      # checkout, and the build below may regenerate files under windows/.
      - name: Stamp build info
        run: |
          flutter pub get
          git status --porcelain
          dart run tool/write_build_info.dart --allow-dirty

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Third-party notices match pubspec.lock
        run: dart run tool/generate_third_party_notices.dart --check

      - name: Build
        run: flutter build windows --release

      # Anything listed here besides lib/core/build_info.dart was generated by
      # `pub get` or the build and belongs in the repository: a tree that the
      # packaging script would refuse on a release is caught here instead.
      - name: Files the build changed
        shell: bash
        run: |
          patch="$RUNNER_TEMP/build-changes.patch"
          git diff -- . ':(exclude)lib/core/build_info.dart' > "$patch"
          git ls-files --others --exclude-standard -z |
            xargs -0 -I{} git diff --no-index /dev/null {} >> "$patch" || true
          dirty=$(git status --porcelain -- . ':(exclude)lib/core/build_info.dart')
          if [[ -n $dirty ]]; then
            echo "$dirty"
            cat "$patch"
            echo "::error::The build changed tracked files; commit them (see the diff above)."
            exit 1
          fi

      # Inno Setup is not on every runner image; the packaging script needs
      # 6.3 or later for ArchitecturesAllowed=x64compatible.
      - name: Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y }

      - name: Package
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            powershell -ExecutionPolicy Bypass -File tool\package_windows_release.ps1 -Version $version -Tag $env:GITHUB_REF_NAME
          } else {
            powershell -ExecutionPolicy Bypass -File tool\package_windows_release.ps1 -Version $version -Tag untagged -SkipBuildCheck
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: hardline-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-changes-windows
          path: ${{ runner.temp }}/build-changes.patch
          if-no-files-found: ignore

  integration:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Screen
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Primary, Bounds

      # All suites in one debug build, as CLAUDE.md describes. The two-user and
      # call suites skip themselves: there is no accounts file here.
      - name: Integration tests (debug)
        run: |
          flutter drive --driver=test_driver/integration_test.dart `
            --target=integration_test/all_test.dart -d windows `
            --dart-define=HARDLINE_TEST_SHOTS=${{ runner.temp }}\shots\debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The overlay suite again as an AOT build like the release: the empty
      # overlay on the first call after launch (bb059af) only happened there.
      - name: Overlay suite (profile)
        if: success() || failure()
        run: |
          flutter drive --driver=test_driver/integration_test.dart `
            --target=integration_test/overlay_window_flow.dart -d windows --profile `
            --dart-define=HARDLINE_TEST_SHOTS=${{ runner.temp }}\shots\profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
