# Build the macOS app and package it as a .dmg.
#
# Release images are built here rather than on a developer's Mac, so every
# release comes from the same clean, documented toolchain. It runs on every
# pull request so a change that breaks macOS is caught there rather than at
# release time, and on a v* tag it produces the release image (see "macOS" in
# RELEASING.md).
#
# The result is an artifact on the run, not a GitHub release: attaching it to
# the release page stays a deliberate, manual step, as on Windows.
name: macos

on:
  push:
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Apple silicon. `flutter build macos --release` builds a universal binary
    # (arm64 + x86_64), and cargokit builds the two Rust plugins for both.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # write_build_info.dart needs the tag to name it on the About screen.
          fetch-depth: 0
          fetch-tags: true

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the toolchain table in RELEASING.md.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # flutter_vodozemac and super_native_extensions are Rust, built by
      # cargokit through rustup. The runner image ships rustup; both Apple
      # targets are added up front so the universal build does not stop
      # halfway to download one.
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The image defaults to Xcode 16, whose macOS 15 SDK lacks APIs that
      # plugins already use behind `#available(macOS 26.0, *)` (connectivity_plus:
      # NWPath.isUltraConstrained), so Swift refuses to compile them. Take the
      # newest Xcode 26 on the image; the app still targets macOS 10.15.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          test -n "$xcode" || { echo "no Xcode 26 on this runner image" >&2; exit 1; }
          sudo xcode-select -s "$xcode"

      # macos/Podfile.lock records the CocoaPods version that wrote it, and
      # `pod install` rewrites that line with its own. Use the same version, or
      # the lock file comes out modified and a tag build fails the clean-tree
      # check before packaging.
      - name: CocoaPods as in Podfile.lock
        run: |
          version=$(sed -n 's/^COCOAPODS: //p' macos/Podfile.lock)
          test -n "$version" || { echo "no COCOAPODS line in macos/Podfile.lock" >&2; exit 1; }
          if [[ "$(pod --version 2>/dev/null)" != "$version" ]]; then
            sudo gem install --no-document cocoapods -v "$version"
          fi

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          rustc --version
          pod --version

      # Before anything else touches the tree: the stamp refuses a dirty
      # checkout, and the build below may regenerate files under macos/.
      - name: Stamp build info
        run: |
          flutter pub get
          git status --porcelain
          dart run tool/write_build_info.dart --allow-dirty

      # The suite has only ever run on Windows. Until it has passed here once,
      # a failure is reported but does not hold back the image.
      - name: Analyze and test
        continue-on-error: true
        run: |
          flutter analyze
          flutter test

      - name: Build
        run: flutter build macos --release

      # Anything listed here besides lib/core/build_info.dart was generated by
      # `pub get` or the build and belongs in the repository. The step fails
      # on pull requests too, so a tree that a tag build would refuse to
      # package is caught before anyone tags it. The diff is in the log and in
      # the build-changes artifact.
      - name: Files the build changed
        run: |
          # `pod install` rewrites the SPEC CHECKSUMS of the Flutter plugin
          # pods, which Flutter generates locally: they come out different
          # here than on a developer's Mac (a different Ruby serialises the
          # podspecs differently) although the pods, their versions and the
          # Podfile are the same. Put the committed lock file back when that
          # section is all that changed; any other change still fails below.
          strip='/^SPEC CHECKSUMS:/,/^$/d'
          if ! git diff --quiet -- macos/Podfile.lock &&
             diff -q <(git show HEAD:macos/Podfile.lock | sed "$strip") \
                     <(sed "$strip" macos/Podfile.lock) >/dev/null; then
            echo "macos/Podfile.lock: only SPEC CHECKSUMS differ; restoring the committed file."
            git diff -- macos/Podfile.lock
            git checkout -- macos/Podfile.lock
          fi
          patch="$RUNNER_TEMP/build-changes.patch"
          git diff -- . ':(exclude)lib/core/build_info.dart' > "$patch"
          git ls-files --others --exclude-standard -z |
            xargs -0 -I{} git diff --no-index /dev/null {} >> "$patch" || true
          dirty=$(git status --porcelain -- . ':(exclude)lib/core/build_info.dart')
          if [[ -n $dirty ]]; then
            echo "$dirty"
            cat "$patch"
            echo "::error::The build changed tracked files; commit them (see the diff above)."
            exit 1
          fi

      - name: Package
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tool/package_macos_release.sh "$version" "$GITHUB_REF_NAME"
          else
            tool/package_macos_release.sh "$version" "untagged" --skip-build-check
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hardline-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-changes
          path: ${{ runner.temp }}/build-changes.patch
          if-no-files-found: ignore
